<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Provider Test Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(to right, #a78bfa, #ec4899);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            color: #c7d2fe;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, var(--gradient-color));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card.passed::before {
            --gradient-color: #10b981, #34d399;
        }

        .stat-card.failed::before {
            --gradient-color: #ef4444, #f87171;
        }

        .stat-card.warnings::before {
            --gradient-color: #f59e0b, #fbbf24;
        }

        .stat-card.total::before {
            --gradient-color: #8b5cf6, #a78bfa;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #c7d2fe;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-card.passed .stat-value {
            color: #10b981;
        }

        .stat-card.failed .stat-value {
            color: #ef4444;
        }

        .stat-card.warnings .stat-value {
            color: #f59e0b;
        }

        .stat-card.total .stat-value {
            color: #a78bfa;
        }

        .results-container {
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .provider-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease both;
        }

        .provider-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .provider-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .provider-name {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        .status-badge.pass {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.pass::before {
            background: #10b981;
        }

        .status-badge.warning {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-badge.warning::before {
            background: #f59e0b;
        }

        .status-badge.fail {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-badge.fail::before {
            background: #ef4444;
        }

        .message {
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid #f59e0b;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e7ff;
        }

        .message.error {
            border-left-color: #ef4444;
        }

        .icon {
            width: 24px;
            height: 24px;
            display: inline-block;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .refresh-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.6);
        }

        .refresh-btn:active {
            transform: translateY(-1px);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 3rem;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .filter-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c7d2fe;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 LLM Provider Test Results</h1>
            <p>Real-time health check status for all providers</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">Total Tests</div>
                <div class="stat-value" id="totalTests">0</div>
            </div>
            <div class="stat-card passed">
                <div class="stat-label">Passing</div>
                <div class="stat-value" id="passedTests">0</div>
            </div>
            <div class="stat-card warnings">
                <div class="stat-label">Warnings</div>
                <div class="stat-value" id="warningTests">0</div>
            </div>
            <div class="stat-card failed">
                <div class="stat-label">Failed</div>
                <div class="stat-value" id="failedTests">0</div>
            </div>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pass">Passing</button>
            <button class="filter-btn" data-filter="warning">Warnings</button>
            <button class="filter-btn" data-filter="fail">Failed</button>
        </div>

        <div class="loading active">
            <div class="spinner"></div>
            <p>Running tests...</p>
        </div>

        <div class="results-container" id="resultsContainer"></div>
    </div>

    <button class="refresh-btn" onclick="runTests()">
        <span>🔄</span>
        <span>Refresh Tests</span>
    </button>

    <script>
        let currentFilter = 'all';
        let testResults = [];

        async function runTests() {
            const loading = document.querySelector('.loading');
            const resultsContainer = document.getElementById('resultsContainer');
            
            loading.classList.add('active');
            resultsContainer.innerHTML = '';

            try {
                const response = await fetch('/api/run-tests');
                const data = await response.json();
                
                testResults = data.results;
                updateStats(data.stats);
                displayResults(testResults);
            } catch (error) {
                console.error('Error running tests:', error);
                // For demonstration, using mock data
                loadMockData();
            }
            
            loading.classList.remove('active');
        }

        function loadMockData() {
            testResults = [
                { name: 'Google Gemini', status: 'pass' },
                { name: 'Groq', status: 'pass' },
                { name: 'Cerebras', status: 'pass' },
                { name: 'Cloudflare Workers AI', status: 'pass' },
                { name: 'Cohere', status: 'pass' },
                { name: 'GitHub Models', status: 'pass' },
                { name: 'HuggingFace', status: 'pass' },
                { 
                    name: 'Replicate', 
                    status: 'warning',
                    message: 'Insufficient credit/billing issue - You have insufficient credit to run this model. Go to https://replicate.com/account/billing#billing to purchase credit.'
                },
                { name: 'NVIDIA NIM', status: 'pass' },
                { 
                    name: 'NLP Cloud', 
                    status: 'warning',
                    message: 'Rate limited - Maximum number of requests per hour reached. Please contact support to learn how to increase this limit.'
                },
                { name: 'OpenRouter', status: 'pass' },
                { name: 'APIFreeLLM', status: 'pass' },
                { name: 'Novita AI', status: 'pass' },
                { name: 'AI21 Labs', status: 'pass' },
                { name: 'Mistral AI (free-tier)', status: 'pass' },
                { name: 'Ollama (Local)', status: 'pass' }
            ];

            const stats = {
                total: testResults.length,
                passed: testResults.filter(r => r.status === 'pass').length,
                warnings: testResults.filter(r => r.status === 'warning').length,
                failed: testResults.filter(r => r.status === 'fail').length
            };

            updateStats(stats);
            displayResults(testResults);
        }

        function updateStats(stats) {
            document.getElementById('totalTests').textContent = stats.total;
            document.getElementById('passedTests').textContent = stats.passed;
            document.getElementById('warningTests').textContent = stats.warnings;
            document.getElementById('failedTests').textContent = stats.failed;
        }

        function displayResults(results) {
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '';

            const filteredResults = currentFilter === 'all' 
                ? results 
                : results.filter(r => r.status === currentFilter);

            filteredResults.forEach((result, index) => {
                const card = document.createElement('div');
                card.className = 'provider-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.dataset.status = result.status;

                const statusText = result.status === 'pass' ? 'PASS' : 
                                  result.status === 'warning' ? 'WARNING' : 'FAIL';

                card.innerHTML = `
                    <div class="provider-header">
                        <div class="provider-name">
                            <span>${getProviderIcon(result.status)}</span>
                            <span>${result.name}</span>
                        </div>
                        <span class="status-badge ${result.status}">${statusText}</span>
                    </div>
                    ${result.message ? `
                        <div class="message ${result.status === 'fail' ? 'error' : ''}">
                            ${result.message}
                        </div>
                    ` : ''}
                `;

                resultsContainer.appendChild(card);
            });
        }

        function getProviderIcon(status) {
            const icons = {
                pass: '✅',
                warning: '⚠️',
                fail: '❌'
            };
            return icons[status] || '⚪';
        }

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                displayResults(testResults);
            });
        });

        // Load initial data
        loadMockData();
    </script>
</body>
</html>
