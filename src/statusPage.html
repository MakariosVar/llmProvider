<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Provider Status</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-online { background-color: #4ade80; box-shadow: 0 0 8px #4ade80; }
        .status-offline { background-color: #94a3b8; }
        .status-error { background-color: #f87171; box-shadow: 0 0 8px #f87171; }
        .status-rate_limited { background-color: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
        
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border-color: rgba(147, 51, 234, 0.5);
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen p-6 bg-[url('https://grainy-gradients.vercel.app/noise.svg')]">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10 glass p-6 rounded-2xl sticky top-6 z-50 shadow-lg">
            <div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">
                    LLM Provider Status
                </h1>
                <p class="text-slate-400 text-sm mt-1">Real-time health monitoring</p>
            </div>
            <div class="flex gap-4">
                <a id="backToChatLink" href="#" class="px-6 py-3 font-bold text-white rounded-xl bg-slate-700 hover:bg-slate-600 transition-all duration-200 shadow-lg flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                    </svg>
                    Back to Chat
                </a>
                <button id="checkStatusBtn" onclick="checkStatus()" class="group relative px-6 py-3 font-bold text-white rounded-xl bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 transition-all duration-200 shadow-lg hover:shadow-purple-500/25 active:scale-95">
                    <span class="flex items-center gap-2">
                        <svg id="refreshIcon" class="w-5 h-5 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        Check Status
                    </span>
                    <div id="loadingSpinner" class="hidden absolute inset-0 flex items-center justify-center bg-inherit rounded-xl">
                        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                </button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="glass p-6 rounded-2xl">
                <div class="text-slate-400 text-sm mb-1">Total Providers</div>
                <div class="text-3xl font-bold text-white" id="totalProviders">0</div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <div class="text-slate-400 text-sm mb-1">Online Models</div>
                <div class="text-3xl font-bold text-emerald-400" id="onlineModels">0</div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <div class="text-slate-400 text-sm mb-1">Rate Limited</div>
                <div class="text-3xl font-bold text-amber-400" id="rateLimitedModels">0</div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <div class="text-slate-400 text-sm mb-1">Errors</div>
                <div class="text-3xl font-bold text-rose-400" id="errorModels">0</div>
            </div>
        </div>

        <!-- Providers Grid -->
        <div id="providersGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Cards injected here -->
        </div>
    </div>

    <script>
        const socket = io();

        // Fetch config to set back link
        fetch('/api/config')
            .then(res => res.json())
            .then(config => {
                if (config.agentUrl) {
                    document.getElementById('backToChatLink').href = config.agentUrl;
                }
            })
            .catch(err => console.error('Failed to load config:', err));

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('status_update', (providers) => {
            providersData = providers;
            render();
        });

        async function checkStatus() {
            const btn = document.getElementById('checkStatusBtn');
            const spinner = document.getElementById('loadingSpinner');
            
            btn.disabled = true;
            spinner.classList.remove('hidden');
            
            try {
                await fetch('/api/status/check', { method: 'POST' });
                // The socket update will handle the UI refresh
            } catch (e) {
                console.error('Check failed', e);
                alert('Failed to trigger status check');
            } finally {
                // Keep spinner for a bit to show activity
                setTimeout(() => {
                    btn.disabled = false;
                    spinner.classList.add('hidden');
                }, 1000);
            }
        }

        function getStatusColor(status) {
            if (status === 'online') return 'text-emerald-400';
            if (status === 'rate_limited') return 'text-amber-400';
            if (status === 'error') return 'text-rose-400';
            return 'text-slate-400';
        }

        function getStatusDotClass(status) {
            if (status === 'online') return 'status-online';
            if (status === 'rate_limited') return 'status-rate_limited';
            if (status === 'error') return 'status-error';
            return 'status-offline';
        }

        function render() {
            const grid = document.getElementById('providersGrid');
            grid.innerHTML = '';

            let totalP = 0;
            let onlineM = 0;
            let rateM = 0;
            let errorM = 0;

            providersData.forEach(p => {
                totalP++;
                const models = p.models || [];
                
                // Calculate provider health
                // We need model statuses. The provider object from getAllProviders() might not have deep model status if not merged?
                // Actually providerManager.getAllProviders() returns the provider config + top level status.
                // We need to fetch model statuses separately or ensure they are attached.
                // Let's assume the server sends enriched data or we need to fetch it.
                // Wait, providerManager.getAllProviders() returns the provider object.
                // The provider object has `models` array.
                // But `modelStatus` is stored separately in `providerManager.modelStatus`.
                // We need to make sure the `status_update` event sends EVERYTHING including model statuses.
                // I should check `server.js` or `providerManager.js` to see what `getAllProviders()` returns.
                // It returns `Object.values(this.providers)`.
                // `this.providers` has `status` but not per-model status (that's in `this.modelStatus`).
                
                // FIX: I need to update `providerManager.getAllProviders()` or the socket event to include model statuses.
                // For now, let's assume the data structure I WANT is passed. I will fix the backend to pass it.
                
                const card = document.createElement('div');
                card.className = 'glass rounded-2xl p-6 card-hover transition-all duration-300 flex flex-col h-full';
                
                let modelsHtml = '';
                let pOnline = 0;
                let latestUpdate = 0;

                models.forEach(m => {
                    // We need to find the status for this model.
                    const mStatusObj = p.modelStatuses ? p.modelStatuses[m] : { status: 'unknown' };
                    const mStatus = mStatusObj ? mStatusObj.status : 'unknown';
                    const mError = mStatusObj ? mStatusObj.lastError : null;
                    
                    // Track latest update
                    const lastActivity = Math.max(mStatusObj.lastSuccess || 0, mStatusObj.lastError || 0);
                    if (lastActivity > latestUpdate) latestUpdate = lastActivity;

                    if (mStatus === 'online') onlineM++;
                    if (mStatus === 'rate_limited') rateM++; 
                    if (mStatus === 'error') {
                         if (mError && String(mError).toLowerCase().includes('rate limit')) {
                             rateM++;
                         } else {
                             errorM++;
                         }
                    }

                    // Provider level counts
                    if (mStatus === 'online') pOnline++;
                    
                    // Display status
                    let displayStatus = mStatus;
                    let displayClass = getStatusDotClass(mStatus);
                    let textClass = getStatusColor(mStatus);
                    
                    if (mStatus === 'error' && mError && String(mError).toLowerCase().includes('rate limit')) {
                        displayStatus = 'Rate Limited';
                        displayClass = 'status-rate_limited';
                        textClass = 'text-amber-400';
                    }

                    modelsHtml += `
                        <div class="flex items-center justify-between py-2 border-b border-slate-700/50 last:border-0">
                            <span class="text-sm font-medium text-slate-200 truncate pr-4" title="${m}">${m}</span>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="text-xs ${textClass}">${displayStatus}</span>
                                <span class="${displayClass} status-dot"></span>
                            </div>
                        </div>
                    `;
                });

                const lastUpdateStr = latestUpdate > 0 ? new Date(latestUpdate).toLocaleString() : 'Never';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-white">${p.name}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs text-slate-400 uppercase tracking-wider">${pOnline} / ${models.length} Online</span>
                            </div>
                            <div class="text-[10px] text-slate-500 mt-1">Last Update: ${lastUpdateStr}</div>
                        </div>
                        <div class="bg-slate-800/50 px-3 py-1 rounded-lg text-xs font-mono text-slate-400">
                            ${models.length} Models
                        </div>
                    </div>
                    <div class="mt-auto space-y-1 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                        ${modelsHtml}
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('totalProviders').innerText = totalP;
            document.getElementById('onlineModels').innerText = onlineM;
            document.getElementById('rateLimitedModels').innerText = rateM;
            document.getElementById('errorModels').innerText = errorM;
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</body>
</html>
